[package]
name = "granthalaya-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Granthalaya core: news edition builder, bias evidence, learner, books, reading comfort"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
dom_smoothie = "0.19.0"
feed-rs = "3.0.0"
futures = "0.3.34"
html-escape = "0.3.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip", "brotli", "query"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["time"] }
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
