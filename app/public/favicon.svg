<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2a1e"/><stop offset="1" stop-color="#22170f"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4ead5"/><stop offset="1" stop-color="#e3d3b0"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="200" fill="url(#bg)"/>
  <!-- book spines -->
  <rect x="180" y="250" width="110" height="560" rx="14" fill="#9c3d2e"/>
  <rect x="300" y="210" width="96" height="600" rx="14" fill="#2f5d50"/>
  <rect x="406" y="280" width="84" height="530" rx="12" fill="#c49a45"/>
  <g fill="#f4ead5" opacity=".55">
    <rect x="200" y="300" width="70" height="10"/><rect x="200" y="740" width="70" height="10"/>
    <rect x="318" y="260" width="60" height="10"/><rect x="318" y="750" width="60" height="10"/>
    <rect x="422" y="330" width="52" height="8"/><rect x="422" y="750" width="52" height="8"/>
  </g>
  <!-- folded newspaper leaning on the books -->
  <g transform="rotate(-8 700 540)">
    <rect x="520" y="250" width="330" height="520" rx="10" fill="url(#paper)"/>
    <rect x="550" y="285" width="270" height="44" fill="#2a1f17"/>
    <rect x="550" y="350" width="270" height="6" fill="#2a1f17"/>
    <g fill="#6b5a48">
      <rect x="550" y="380" width="125" height="120"/>
      <rect x="695" y="380" width="125" height="10"/><rect x="695" y="405" width="125" height="10"/>
      <rect x="695" y="430" width="125" height="10"/><rect x="695" y="455" width="100" height="10"/>
      <rect x="550" y="525" width="270" height="10"/><rect x="550" y="550" width="270" height="10"/>
      <rect x="550" y="575" width="240" height="10"/><rect x="550" y="610" width="125" height="10"/>
      <rect x="550" y="635" width="125" height="10"/><rect x="695" y="610" width="125" height="10"/>
      <rect x="695" y="635" width="125" height="10"/><rect x="550" y="660" width="110" height="10"/>
    </g>
  </g>
  <rect x="150" y="810" width="724" height="22" rx="8" fill="#c8a875"/>
</svg>
