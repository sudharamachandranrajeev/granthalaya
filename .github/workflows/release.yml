# Builds a release when a tag like v0.2.0 is pushed. Jobs that upload or touch
# the Android signing key run in the `release` environment, which only accepts
# v* tags and waits for the owner's approval. Everything lands in a DRAFT
# release; the owner publishes it by hand after the checks at the end pass.
#
# Assets: Linux AppImage + .deb, Windows installer (.exe) + .msi, macOS .dmg
# (Apple Silicon), Android APK, SHA256SUMS.txt. Desktop builds are not code
# signed; the README says what the first launch looks like because of that.
#
# Secrets (release environment): GRANTHALAYA_KEYSTORE_BASE64,
# GRANTHALAYA_KEYSTORE_PASSWORD (key alias "granthalaya").
# Variable: APK_CERT_SHA256, the public SHA-256 of the signing certificate.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  REPO_URL: https://github.com/${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Tag matches every version number
        id: v
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(jq -r .version app/src-tauri/tauri.conf.json)
          pkg=$(jq -r .version app/package.json)
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' app/src-tauri/Cargo.toml | head -1)
          echo "tag $tag, tauri.conf $conf, package.json $pkg, Cargo.toml $crate"
          [[ $tag == "$conf" && $tag == "$pkg" && $tag == "$crate" ]]
          grep -q "^## \[$tag\]" CHANGELOG.md || { echo "CHANGELOG.md has no section ## [$tag]"; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: UI check
        working-directory: app
        run: |
          npm ci
          npm run check
          npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Leak scan
        run: |
          v=8.30.1
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_checksums.txt"
          grep " gitleaks_${v}_linux_x64.tar.gz\$" "gitleaks_${v}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${v}_linux_x64.tar.gz" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: scripts/check-public.sh --history

  create:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      id: ${{ steps.r.outputs.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Draft release with the changelog section as notes
        id: r
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          awk -v v="## [$VERSION]" 'index($0, v) == 1 { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          # The create call returns the id. Listing releases straight after can miss the new draft.
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$GITHUB_REF_NAME" \
            -f name="Granthālaya $VERSION" -F body=@notes.md -F draft=true --jq .id)
          [[ $id =~ ^[0-9]+$ ]] || { echo "no release id: '$id'" >&2; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"

  desktop:
    needs: [check, create]
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: appimage,deb
          - os: windows-latest
            bundles: nsis,msi
          - os: macos-latest
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - working-directory: app
        run: npm ci
      - name: Build and upload to the draft
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: app
          tauriScript: npm run tauri
          args: --bundles ${{ matrix.bundles }}
          releaseId: ${{ needs.create.outputs.id }}
          uploadUpdaterJson: false

  android:
    needs: [check, create]
    environment: release
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - name: NDK
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build the APK (unsigned)
        working-directory: app
        run: |
          npm ci
          npm run tauri android build -- --ci --apk --target aarch64
      - name: Sign with the release key, then upload
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          KEYSTORE_BASE64: ${{ secrets.GRANTHALAYA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.GRANTHALAYA_KEYSTORE_PASSWORD }}
        run: |
          tools=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          unsigned=$(find app/src-tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' | head -1)
          test -n "$unsigned"
          ks="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$ks"' EXIT
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ks"
          name="Granthalaya_${VERSION}_aarch64.apk"
          "$tools/zipalign" -P 16 -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$ks" --ks-key-alias granthalaya --ks-pass env:KEYSTORE_PASSWORD \
            --out "$name" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify "$name"
          gh release upload "$GITHUB_REF_NAME" "$name"

  finish:
    needs: [check, create, desktop, android]
    environment: release
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.check.outputs.version }}
      APK_CERT_SHA256: ${{ vars.APK_CERT_SHA256 }}
    steps:
      - name: Download every asset of the draft
        run: gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -D dist
      - name: Checks before the owner publishes
        run: |
          sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-0 libayatana-appindicator3-1
          cd dist
          echo "-- every platform is here"
          for want in '*.AppImage' '*.deb' '*-setup.exe' '*.msi' '*.dmg' '*_aarch64.apk'; do
            ls $want >/dev/null 2>&1 || { echo "missing $want"; exit 1; }
          done
          echo "-- APK is signed with the release certificate"
          [[ -n $APK_CERT_SHA256 ]] || { echo "set the APK_CERT_SHA256 repository variable"; exit 1; }
          tools=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          "$tools/apksigner" verify --print-certs Granthalaya_*_aarch64.apk | tee "$RUNNER_TEMP/cert.txt"
          grep -q "SHA-256 digest: $APK_CERT_SHA256" "$RUNNER_TEMP/cert.txt"
          echo "-- AppImage starts and reports its version"
          chmod +x ./*.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ./*.AppImage --version | tee "$RUNNER_TEMP/ver.txt"
          grep -qx "Granthalaya $VERSION" "$RUNNER_TEMP/ver.txt"
          echo "-- .deb carries this version"
          [[ $(dpkg-deb -f ./*.deb Version) == "$VERSION" ]]
      - name: Upload SHA256SUMS.txt
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt -R "$GITHUB_REPOSITORY"
          echo "Draft ready: $REPO_URL/releases (publish it by hand)."
